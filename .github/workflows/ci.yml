name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run generate
      - run: git diff --exit-code -- data/generated
      - run: npm run validate:data
      - name: Upload generated data for provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-84-generated-data-${{ github.sha }}
          path: data/generated/
      - name: Upload issue-86 generated data provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-86-generated-data-${{ github.sha }}
          path: data/generated/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run generate
      - run: npm exec -- vitest run --config vitest.config.ts

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run browser:test
      - name: Upload browser visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-84-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      LIVE_BASE_URL: https://vallerance.github.io/TerraDash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test browser/live-deployed.spec.ts
